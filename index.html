<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiet Operator</title>
<meta name="description" content="Quiet Operator is Bill Wagner's workshop: small software built with AI, running every day, open to try with sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root {
    --bg: #EEF0EC; --surface: #F8F9F7; --surface-2: #E4E7E2;
    --ink: #1F2422; --muted: #5E6763; --line: #CDD2CC; --line-strong: #9BA39D;
    --accent: #1D5D63; --accent-ink: #F2F7F7;
    --lamp-live: #2E8B57; --lamp-client: #3C6FB1; --lamp-paused: #C98A12;
    --frame: #0F1417; --frame-bar: #1A2124; --frame-ink: #AEB6B1;
    --grid: rgba(31, 36, 34, .09);
    --focus: #1D5D63;
    --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181A; --surface: #1C2023; --surface-2: #242A2D;
      --ink: #E8EAE6; --muted: #9AA39E; --line: #2E3539; --line-strong: #4A5358;
      --accent: #7CC4C9; --accent-ink: #0F1D1F;
      --lamp-live: #4DBF7D; --lamp-client: #6E9FE0; --lamp-paused: #E0A52E;
      --frame: #0B0E10; --frame-bar: #161B1E; --frame-ink: #8F9994;
      --grid: rgba(232, 234, 230, .07);
      --focus: #7CC4C9;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15181A; --surface: #1C2023; --surface-2: #242A2D;
    --ink: #E8EAE6; --muted: #9AA39E; --line: #2E3539; --line-strong: #4A5358;
    --accent: #7CC4C9; --accent-ink: #0F1D1F;
    --lamp-live: #4DBF7D; --lamp-client: #6E9FE0; --lamp-paused: #E0A52E;
    --frame: #0B0E10; --frame-bar: #161B1E; --frame-ink: #8F9994;
    --grid: rgba(232, 234, 230, .07);
    --focus: #7CC4C9;
  }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 72px); scroll-behavior: smooth; overflow-x: clip; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  img { max-width: 100%; height: auto; display: block; }
  a { color: var(--accent); text-decoration: none; text-underline-offset: 3px; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 3px; }

  h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -0.015em; line-height: 1.06; margin: 0; }
  h1 { font-size: clamp(2.2rem, 5.4vw, 3.9rem); font-variation-settings: "opsz" 96; }
  h2 { font-size: clamp(1.45rem, 2.6vw, 1.9rem); font-variation-settings: "opsz" 48; }
  h3 { font-size: 1.1rem; line-height: 1.25; }
  p { margin: 0 0 1em; max-width: 66ch; }
  p:last-child { margin-bottom: 0; }

  /* ---------- motion: one page-load reveal, nothing else unprompted ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .reveal { opacity: 0; animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes lamp { 0%, 100% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--lamp-live) 22%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--lamp-live) 10%, transparent); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .reveal { opacity: 1; }
    html { scroll-behavior: auto; }
  }

  /* ---------- shell ---------- */
  .wrap { width: min(1080px, calc(100% - 2.5rem)); margin: 0 auto; }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--ink); letter-spacing: -0.01em; display: inline-flex; align-items: center; gap: .55rem; }
  .brand:hover { text-decoration: none; }
  .brand .mark { width: 11px; height: 11px; border: 2px solid var(--ink); border-radius: 50%; position: relative; }
  .brand .mark::after { content: ""; position: absolute; inset: 2px; background: var(--ink); border-radius: 50%; }
  .nav { display: flex; gap: 1.4rem; }
  .nav a { color: var(--muted); font-weight: 500; font-size: .95rem; }
  .nav a.on, .nav a:hover { color: var(--ink); text-decoration: none; }
  main { padding: 0 0 5rem; }
  footer { border-top: 1px solid var(--line); padding: 1.6rem 0 2.2rem; color: var(--muted); font-size: .92rem; }
  footer .wrap { display: flex; flex-wrap: wrap; gap: .8rem 2rem; justify-content: space-between; }

  /* ---------- lamps, buttons, chips ---------- */
  .lamp { display: inline-flex; align-items: center; gap: .45rem; font-size: .88rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .lamp::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--lamp-live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lamp-live) 22%, transparent); animation: lamp 3.2s ease-in-out infinite; }
  .lamp.client::before { background: var(--lamp-client); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lamp-client) 22%, transparent); animation: none; }
  .lamp.paused::before { background: var(--lamp-paused); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lamp-paused) 22%, transparent); animation: none; }
  .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .7rem 1.1rem; border-radius: 7px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; font-size: .95rem; line-height: 1; cursor: pointer; font-family: var(--body); transition: background .15s, border-color .15s, transform .15s; }
  .btn:hover { text-decoration: none; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); border-color: var(--ink); }
  .btn.soon { background: transparent; color: var(--muted); border-style: dashed; border-color: var(--line-strong); cursor: default; }
  .btn.soon:hover { background: transparent; color: var(--muted); border-color: var(--line-strong); }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip { font-size: .8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .18rem .6rem; background: var(--surface); }

  /* ---------- device frame (browser window) ---------- */
  .device { background: var(--frame); border-radius: 12px; border: 1px solid color-mix(in srgb, var(--frame) 60%, var(--line-strong)); box-shadow: 0 30px 60px -30px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.04) inset; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
  .device .bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--frame-bar); border-bottom: 1px solid rgba(255,255,255,.06); }
  .device .bar i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.16); }
  .device .bar .url { margin-left: 8px; flex: 1; max-width: 360px; font-size: 11px; color: var(--frame-ink); background: rgba(255,255,255,.05); border-radius: 5px; padding: 4px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .device .screen { position: relative; aspect-ratio: 16 / 10; background: #0D1220; overflow: hidden; }
  .device .screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; opacity: 0; transition: opacity .6s ease; }
  .device .screen img.on { opacity: 1; }
  .device .screen iframe { position: absolute; top: 0; left: 0; width: 161.3%; height: 161.3%; border: 0; transform: scale(.62); transform-origin: 0 0; background: #0D1220; }
  .device .screen .tile { position: absolute; inset: 0; display: grid; place-items: center; color: var(--frame-ink); }
  .device .screen .tile b { font-family: var(--display); font-size: clamp(2rem, 6vw, 4rem); font-weight: 700; letter-spacing: -0.03em; color: var(--tile, #2DD4BF); }

  /* ---------- home: hero ---------- */
  .hero { position: relative; padding: 3.4rem 0 2.4rem; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.2fr); gap: 2.2rem 3.2rem; align-items: center; }
  .hero::before { content: ""; position: absolute; inset: -1px -1.25rem 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 60% 40%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 70% 80% at 60% 40%, #000 30%, transparent 75%); }
  .hero h1 { max-width: 13ch; }
  .hero .lede { font-size: 1.08rem; color: var(--muted); max-width: 46ch; margin: 1.1rem 0 1.4rem; }
  .hero .cta { display: flex; gap: .6rem; flex-wrap: wrap; }
  .hero-visual { position: relative; --accent: #2DD4BF; }
  .hero-visual::before { content: ""; position: absolute; inset: 8% -6% -4%; z-index: -1; border-radius: 40px; filter: blur(48px); opacity: .55;
    background: radial-gradient(60% 60% at 50% 50%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 70%); transition: background .6s; }
  .day { display: grid; gap: 1rem; }
  .day-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .day-head h2 { font-size: 1.05rem; font-weight: 600; }
  .day-head span { font-size: .82rem; color: var(--muted); }
  .strip { position: relative; height: 54px; }
  .strip .rail { position: absolute; left: 0; right: 0; top: 22px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .strip .band { position: absolute; top: 0; bottom: 0; background: var(--c); opacity: .9; }
  .strip .ticks { position: absolute; left: 0; right: 0; top: 36px; display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); }
  .strip .dot { position: absolute; top: 24px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--bg); box-shadow: 0 0 0 2px var(--c) inset; transition: transform .2s, box-shadow .2s; transform: translateY(-50%); }
  .strip .dot:hover, .strip .dot[aria-current="true"] { background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 28%, transparent); transform: translateY(-50%) scale(1.15); }
  .strip .dot span { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 6px; font-size: .72rem; font-weight: 600; color: var(--ink); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; }
  .strip .dot[aria-current="true"] span, .strip .dot:hover span { opacity: 1; }
  .moment { display: grid; grid-template-columns: 1fr 150px; gap: 1.2rem; align-items: center; min-height: 290px; }
  .moment .mtext { display: grid; gap: .55rem; align-content: start; }
  .moment .mtop { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
  .moment .mtop b { font-family: var(--display); font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); margin-right: .2rem; }
  .moment .app { display: inline-flex; align-items: center; gap: .4rem; font-weight: 600; color: var(--ink); }
  .moment .app i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .moment .area { border: 1px solid var(--line); border-radius: 999px; padding: .12rem .55rem; }
  .moment p { font-size: 1.02rem; color: var(--ink); max-width: 34ch; }
  .moment .mlink { font-size: .88rem; }
  .moment .phone { width: 150px; margin: 0; padding: 18px 7px 12px; border-radius: 28px; }
  .moment .phone::before { width: 36px; height: 4px; top: 7px; }
  .moment .phone .scr { border-radius: 18px; }
  .moment .phone .scr img { transition: opacity .35s; }
  .progress { height: 2px; background: var(--line); border-radius: 1px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ink); opacity: .55; }
  .hero .cap { margin-top: .4rem; }
  @media (max-width: 480px) { .moment { grid-template-columns: 1fr 120px; } .moment .phone { width: 120px; } .strip .dot span { display: none; } }
  @media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-top: 2.4rem; } .hero h1 { max-width: 16ch; } }

  /* ---------- home: build cards ---------- */
  .grid-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin: 2.2rem 0 1.1rem; }
  .grid-head h2 { font-size: clamp(1.3rem, 2.2vw, 1.6rem); }
  .grid-head span { color: var(--muted); font-size: .9rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
  .card { --accent: #2DD4BF; --mx: 50%; --my: 50%; position: relative; display: grid; grid-template-rows: auto 1fr; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); color: inherit; overflow: hidden; isolation: isolate; transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s; }
  .card:hover { text-decoration: none; transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .card::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(520px circle at var(--mx) var(--my), color-mix(in srgb, var(--accent) 12%, transparent), transparent 42%); }
  .card:hover::before { opacity: 1; }
  .card.wide { grid-column: 1 / -1; grid-template-columns: 1.25fr 1fr; grid-template-rows: none; }
  .card-media { position: relative; background: var(--frame); aspect-ratio: 16 / 10; overflow: hidden; }
  .card.wide .card-media { aspect-ratio: auto; min-height: 360px; }
  .card-media .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .card:hover .card-media .shot { transform: scale(1.025); }
  .card-media .shot-p { position: absolute; right: 5%; bottom: -8%; width: 23%; border-radius: 18px; border: 3px solid #0A0D0F; background: #0A0D0F; box-shadow: 0 20px 40px -16px rgba(0,0,0,.6); transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .card:hover .card-media .shot-p { transform: translateY(-6px); }
  .card-media .tilebg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--frame-ink); }
  .card-media .tilebg b { font-family: var(--display); font-size: 3rem; font-weight: 700; color: var(--accent); }
  .card-body { position: relative; z-index: 1; padding: 1.2rem 1.3rem 1.3rem; display: grid; gap: .7rem; align-content: start; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .card-top h3 { font-size: 1.35rem; letter-spacing: -0.015em; }
  .goal { margin: .25rem 0 0; font-family: var(--display); font-weight: 500; font-size: 1rem; color: var(--ink); letter-spacing: -0.005em; max-width: 34ch; font-variation-settings: "opsz" 24; }
  .card-body .goal + p, .card-body p { max-width: none; }
  .bhead .goal.big { font-size: 1.3rem; margin: .5rem 0 0; max-width: 40ch; }
  .bhead .goal.big + .one { margin-top: .6rem; }
  .card-body p { color: var(--muted); font-size: .95rem; max-width: none; }
  .caps { display: flex; flex-wrap: wrap; gap: .35rem; list-style: none; margin: .1rem 0 0; padding: 0; }
  .caps li { font-size: .78rem; font-weight: 500; color: var(--ink); border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: .22rem .6rem; }
  .card .open { font-weight: 600; font-size: .92rem; color: var(--accent-ink-text, var(--accent)); margin-top: .2rem; filter: saturate(.8) brightness(.85); }
  .card:hover .open { text-decoration: underline; text-underline-offset: 3px; }
  /* websites: a separate section with browser-framed cards */
  .sites { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--line-strong); }
  .sites-head { display: grid; grid-template-columns: 1fr 2fr; gap: .8rem 3rem; align-items: start; margin-bottom: 1.6rem; }
  .sites-head h2 { font-size: clamp(1.3rem, 2.2vw, 1.6rem); }
  .sites-head p { color: var(--muted); margin: 0; }
  .card.site .card-media { display: grid; grid-template-rows: auto 1fr; aspect-ratio: auto; }
  .card.site .card-media .bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--frame-bar); border-bottom: 1px solid rgba(255,255,255,.06); }
  .card.site .card-media .bar i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.16); }
  .card.site .card-media .bar .url { margin-left: 8px; flex: 1; max-width: 300px; font-size: 11px; color: var(--frame-ink); background: rgba(255,255,255,.05); border-radius: 5px; padding: 4px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.site .card-media .view { position: relative; aspect-ratio: 16 / 10; overflow: hidden; }
  @media (max-width: 760px) { .sites-head { grid-template-columns: 1fr; } }
  @media (max-width: 860px) { .grid, .grid.tools { grid-template-columns: 1fr; } .card.wide { grid-template-columns: 1fr; } .card.wide .card-media { aspect-ratio: 16 / 10; min-height: 0; } .grid-head { flex-direction: column; align-items: flex-start; gap: .2rem; } }

  /* ---------- home: how I build ---------- */
  .how { margin-top: 4.5rem; }
  .how-head { display: grid; grid-template-columns: 1fr 2fr; gap: .8rem 3rem; align-items: start; margin-bottom: 1.8rem; }
  .how-head h2 { max-width: 12ch; }
  .how-head p { color: var(--muted); font-size: 1.05rem; max-width: 56ch; }
  .toolbox { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 2rem; margin: 0; border-top: 1px solid var(--line-strong); }
  .tool { padding: 1.1rem 0 1.3rem; border-bottom: 1px solid var(--line); }
  .tool dt { font-family: var(--display); font-weight: 600; font-size: 1.12rem; letter-spacing: -0.01em; margin-bottom: .35rem; }
  .tool dd { margin: 0; color: var(--muted); font-size: .95rem; max-width: 36ch; }
  .rules { display: grid; grid-template-columns: 1fr 2fr; gap: .8rem 3rem; margin-top: 2.4rem; }
  .rules h3 { font-size: 1.15rem; }
  .rules ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .9rem; }
  .rules li { color: var(--muted); max-width: 64ch; padding-left: 1rem; border-left: 2px solid var(--line-strong); }
  .rules li b { color: var(--ink); font-weight: 600; }
  @media (max-width: 900px) { .toolbox { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 760px) { .how-head, .rules { grid-template-columns: 1fr; } .toolbox { grid-template-columns: 1fr; } }

  .about-teaser { margin-top: 4.5rem; padding-top: 2rem; border-top: 1px solid var(--line-strong); display: grid; grid-template-columns: 1fr 2fr; gap: 1rem 3rem; }
  @media (max-width: 760px) { .about-teaser { grid-template-columns: 1fr; } }

  /* ---------- build page ---------- */
  .page { padding-top: 2.6rem; }
  .crumb { font-size: .92rem; color: var(--muted); margin-bottom: 1.6rem; display: inline-block; }
  .crumb:hover { color: var(--ink); }
  .bhead { display: grid; grid-template-columns: 1fr auto; gap: 1.2rem 2rem; align-items: end; padding-bottom: 1.8rem; }
  .bhead h1 { display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
  .bhead h1 small { font-family: var(--body); font-weight: 400; font-size: .95rem; color: var(--muted); letter-spacing: 0; line-height: 1.3; }
  .bhead .one { font-size: 1.1rem; color: var(--muted); margin: .7rem 0 1rem; max-width: 62ch; }
  .bhead .meta { display: grid; gap: .7rem; justify-items: start; }
  .bhead .actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  .bhead .note { font-size: .82rem; color: var(--muted); }
  @media (max-width: 760px) { .bhead { grid-template-columns: 1fr; } }
  .heroshot { margin-bottom: 1rem; }

  .sec { padding: 2.6rem 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr 2.4fr; gap: .8rem 3rem; }
  .sec > h2 { max-width: 14ch; }
  .sec .body { font-size: 1.05rem; }
  .sec.wide { grid-template-columns: 1fr; gap: 1.4rem; }
  @media (max-width: 760px) { .sec { grid-template-columns: 1fr; } }

  /* scroll story: steps on the left, one sticky frame on the right */
  .story { display: grid; grid-template-columns: 1fr 1.6fr; gap: 2rem 3rem; align-items: start; }
  .steps { display: grid; }
  .step { padding: 1.4rem 0; border-top: 1px solid var(--line); opacity: .5; transition: opacity .35s; cursor: default; }
  .step:first-child { border-top: 0; }
  .step.on { opacity: 1; }
  .step h3 { margin-bottom: .35rem; }

const app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const STATUS = { live: ["", "Live"], mockup: ["client", "Mockup"], paused: ["paused", "Paused"] };
const PREVIEW = !!window.__PREVIEW__;
const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
let cleanup = [];

function lamp(status) { const [cls, label] = STATUS[status] || STATUS.live; return `<span class="lamp ${cls}">${label}</span>`; }
function thumb(b) {
  if (b.hero) return `<span class="thumb"><img src="${esc(b.hero)}" alt="" loading="lazy"></span>`;
  return `<span class="thumb" style="--tile:${esc(b.tile || "#2DD4BF")}"><b>${esc(initials(b.name))}</b></span>`;
}
function deviceBar(url) { return `<div class="bar"><i></i><i></i><i></i><span class="url">${esc(url)}</span></div>`; }

  const bands = M.map((m, k) => { const a = m.h, b = M[k + 1] ? (m.h + M[k + 1].h) / 2 : END; return `<span class="band" style="--c:${esc(byApp[m.app].tile)};left:${pct(k ? (M[k - 1].h + m.h) / 2 : START)}%;right:${100 - pct(b)}%"></span>`; }).join("");
  strip.innerHTML = `<div class="rail">${bands}</div><div class="ticks"><span>6 am</span><span>noon</span><span>6 pm</span><span>11 pm</span></div>` +
    M.map((m, k) => `<button type="button" class="dot" data-k="${k}" style="--c:${esc(byApp[m.app].tile)};left:${pct(m.h)}%" aria-label="${esc(m.t)}, ${esc(byApp[m.app].name)}"><span>${esc(m.t)}</span></button>`).join("");
  moment.innerHTML = `<div class="mtext"><div class="mtop"><b id="m-t"></b><span class="app" id="m-app"><i></i><span></span></span><span class="area" id="m-area"></span></div><p id="m-text"></p><a class="mlink" id="m-link" href="#/"></a></div>

  let cur = 0, timer = null, t0 = 0, paused = false;
  const STEP = 5200;
  const show = (k) => {

    moment.querySelector("#m-area").textContent = m.area; moment.querySelector("#m-text").textContent = m.text;
    const link = moment.querySelector("#m-link"); link.textContent = `Open ${b.name}`; link.href = `#/builds/${b.slug}`;
    moment.querySelectorAll("img").forEach((im) => im.classList.toggle("on", Number(im.dataset.k) === k));
    strip.querySelectorAll(".dot").forEach((d) => d.setAttribute("aria-current", String(Number(d.dataset.k) === k)));
    t0 = performance.now();
  };
  const tick = (now) => { if (!timer) return; const e = paused ? 0 : now - t0; if (paused) t0 = now - (Number(prog.dataset.e) || 0); prog.dataset.e = e; prog.style.width = `${Math.min(100, (e / STEP) * 100)}%`; if (e >= STEP) show((cur + 1) % M.length); timer = requestAnimationFrame(tick); };
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  strip.querySelectorAll(".dot").forEach((d) => { d.addEventListener("mouseenter", () => show(Number(d.dataset.k))); d.addEventListener("click", () => show(Number(d.dataset.k))); d.addEventListener("focus", () => show(Number(d.dataset.k))); });
  visual.addEventListener("mouseenter", () => { paused = true; }); visual.addEventListener("mouseleave", () => { paused = false; });
  visual.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") { show((cur + 1) % M.length); e.preventDefault(); } if (e.key === "ArrowLeft") { show((cur - 1 + M.length) % M.length); e.preventDefault(); } });
  show(0);
  if (!reduced) { timer = requestAnimationFrame(tick); cleanup.push(() => { cancelAnimationFrame(timer); timer = null; }); }

  // cards: spotlight follows the pointer

  app.addEventListener("pointermove", onMove);
  cleanup.push(() => app.removeEventListener("pointermove", onMove));
}

function renderBuild(slug) {
  const i = BUILDS.findIndex((b) => b.slug === slug);
  if (i < 0) return renderNotFound();
  const b = BUILDS[i];
  const prev = BUILDS[(i - 1 + BUILDS.length) % BUILDS.length];
  const next = BUILDS[(i + 1) % BUILDS.length];
  document.title = `${b.name} — Quiet Operator`;
  const hasPhone = !!b.heroPhone || b.features.some((f) => f[4]);
  const startMode = hasPhone && b.primary === "phone" ? "phone" : "desktop";

  const actions = [];
  if (b.demo && PREVIEW && b.demoPreview) actions.push(`<a class="btn" href="${esc(b.demoPreview)}" target="_blank" rel="noopener">Open the demo</a>`);
  else if (b.demo && PREVIEW) actions.push(`<span class="btn soon" aria-disabled="true">Demo built, opens on the live site</span>`);
  else if (b.demo) actions.push(`<a class="btn" href="${esc(b.demo)}">Open the demo</a>`);
  else actions.push(`<span class="btn soon" aria-disabled="true">Demo in progress</span>`);
  if (b.demo && !PREVIEW) actions.push(`<button class="btn ghost" type="button" id="phone-demo">Try it at phone size</button>`);
  if (b.live) actions.push(`<a class="btn ghost" href="${esc(b.live)}" target="_blank" rel="noopener">Visit the live site</a>`);
  const note = b.demo ? `<span class="note">Sample data. Resets when you reload.</span>` : "";
  const url = b.demo ? "quietoperator.ai/" + b.demo : b.live ? b.live.replace(/^https?:\/\//, "") : b.name;
  const tileFor = (k, on) => `<div class="tile${on ? " on" : ""}" data-k="${k}" style="--tile:${esc(b.tile || "#2DD4BF")};opacity:${on ? 1 : 0}"><b>${esc(initials(b.name))}</b></div>`;
  const phoneFrame = (inner, cls = "") => `<div class="phone ${cls}"><div class="scr">${inner}</div></div>`;

  const heroDesk = b.hero ? `<div class="device">${deviceBar(url)}<div class="screen"><img src="${esc(b.hero)}" alt="${esc(b.name)} on a desktop" class="on"></div></div>` : "";
  const heroPh = b.heroPhone ? phoneFrame(`<img src="${esc(b.heroPhone)}" alt="${esc(b.name)} on a phone" class="on">`) : heroDesk;
  const toggle = hasPhone ? `<div class="view-row reveal" style="--i:2"><span>Screens</span><div class="viewtoggle" role="group" aria-label="Screenshot size"><button type="button" data-mode="desktop">Desktop</button><button type="button" data-mode="phone">Phone</button></div></div>` : "";
  const heroBlock = heroDesk || heroPh ? `<div class="heroshot reveal" style="--i:2"><div class="for-desktop">${heroDesk}</div><div class="for-phone">${heroPh}</div></div>` : "";

  const steps = b.features.map(([t, d, cap, src, psrc], k) => {
    const deskMini = `<div class="mini">${src ? `<img src="${esc(src)}" alt="${esc(cap)}" loading="lazy">` : `<span>${esc(cap)}</span>`}</div>`;
    const phoneMini = psrc ? phoneFrame(`<img class="on" src="${esc(psrc)}" alt="${esc(cap)} on a phone" loading="lazy">`) : deskMini;
    return `
    <div class="step${k === 0 ? " on" : ""}" data-k="${k}">
      <h3>${esc(t)}</h3><p>${esc(d)}</p>
      <div class="mshot"><div class="for-desktop">${deskMini}</div><div class="for-phone">${phoneMini}</div></div>
    </div>`;
  }).join("");
  const deskShots = b.features.map(([t, d, cap, src], k) => src ? `<img src="${esc(src)}" alt="${esc(cap)}" class="${k === 0 ? "on" : ""}" data-k="${k}">` : tileFor(k, k === 0)).join("");
  const phoneShots = b.features.map(([t, d, cap, src, psrc], k) => psrc ? `<img src="${esc(psrc)}" alt="${esc(cap)} on a phone" class="${k === 0 ? "on" : ""}" data-k="${k}">` : tileFor(k, k === 0)).join("");

  app.innerHTML = `
    <div class="page mode-${startMode}">
    <a class="crumb reveal" style="--i:0" href="#/">All builds</a>
    <header class="bhead reveal" style="--i:1">
      <div>
        <h1>${esc(b.name)}${b.subtitle ? `<small>${esc(b.subtitle)}</small>` : ""}</h1>
        ${b.goal ? `<p class="goal big">${esc(b.goal)}</p>` : ""}
        <p class="one">${esc(b.one)}</p>
        <div class="chips">${(b.caps || b.stack).map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>
      </div>
      <div class="meta">
        ${lamp(b.status)}
        <div class="actions">${actions.join("")}</div>
        ${note}
        <span class="note">Built with ${esc(b.builtWith)}</span>
      </div>
    </header>
    ${toggle}
    ${heroBlock}

    <section class="sec">
      <h2>Why I built it</h2>
      <div class="body"><p>${esc(b.why)}</p></div>
    </section>

    <section class="sec wide">
      <h2>What it does</h2>
      <div class="story">
        <div class="steps" id="steps">${steps}</div>
        <div class="stage">
          <div class="for-desktop"><div class="device">${deviceBar(b.name)}<div class="screen" id="stage-desk">${deskShots}</div></div></div>
          <div class="for-phone">${phoneFrame(phoneShots, "stage-phone")}</div>
          <div class="label" id="stage-label">${esc(b.features[0][2])}</div>
        </div>
      </div>
    </section>

    <section class="sec">
      <h2>${esc(b.weekLabel || "A week with it")}</h2>
      <p class="week">${esc(b.week)}</p>
    </section>

    <section class="sec">
      <h2>Under the hood</h2>
      <details>
        <summary>Stack, process, and what was hard</summary>
        <div class="inner"><div class="chips" style="margin-bottom:.9rem">${b.stack.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div><p>${esc(b.hood)}</p></div>
      </details>
    </section>

    <nav class="pager" aria-label="Other builds">
      <a href="#/builds/${prev.slug}"><span>Previous</span>${esc(prev.name)}</a>
      <a class="next" href="#/builds/${next.slug}"><span>Next</span>${esc(next.name)}</a>
    </nav>
    </div>`;
  window.scrollTo(0, 0);

  const page = app.querySelector(".page");
  const setMode = (m) => {
    page.classList.toggle("mode-phone", m === "phone"); page.classList.toggle("mode-desktop", m !== "phone");
    app.querySelectorAll(".viewtoggle button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === m)));
  };
  setMode(startMode);
  app.querySelectorAll(".viewtoggle button").forEach((x) => x.addEventListener("click", () => setMode(x.dataset.mode)));

  // scroll story: the step nearest the middle of the viewport drives both frames
  const stepEls = [...app.querySelectorAll("#steps .step")];
  const shots = [...app.querySelectorAll(".stage [data-k]")];
  const label = app.querySelector("#stage-label");
  const activate = (k) => {
    stepEls.forEach((x) => x.classList.toggle("on", Number(x.dataset.k) === k));
    shots.forEach((x) => { const on = Number(x.dataset.k) === k; x.classList.toggle("on", on); if (x.classList.contains("tile")) x.style.opacity = on ? 1 : 0; });
    label.textContent = b.features[k][2];
  };
  const onScroll = () => {
    const mid = window.innerHeight * 0.45; let best = 0, bestD = Infinity;
    stepEls.forEach((x) => { const r = x.getBoundingClientRect(); const dd = Math.abs(r.top + r.height / 2 - mid); if (dd < bestD) { bestD = dd; best = Number(x.dataset.k); } });
    activate(best);
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  stepEls.forEach((x) => x.addEventListener("click", () => activate(Number(x.dataset.k))));
  cleanup.push(() => window.removeEventListener("scroll", onScroll));

  // the real demo inside a phone-sized frame (live site only)
  const pd = app.querySelector("#phone-demo");
  if (pd) pd.addEventListener("click", () => openPhoneDemo(b));
}

function openPhoneDemo(b) {
  const scale = Math.min(1, (window.innerHeight - 110) / 892, (window.innerWidth - 32) / 412);
  const o = document.createElement("div");
  o.className = "phone-modal"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-label", `${b.name} at phone size`);
  o.innerHTML = `<div class="pm-inner">
      <div class="pm-size" style="width:${412 * scale}px;height:${892 * scale}px">
        <div class="phone live" style="transform:scale(${scale})"><div class="scr"><iframe src="${esc(b.demo)}" title="${esc(b.name)} demo at phone size"></iframe></div></div>
      </div>
      <div class="pm-bar"><span>${esc(b.name)} at phone size, with sample data.</span><a class="btn ghost" href="${esc(b.demo)}">Open full screen</a><button class="btn" type="button" data-close>Close</button></div>
    </div>`;
  const close = () => { o.remove(); document.body.style.overflow = ""; window.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  o.addEventListener("click", (e) => { if (e.target === o || e.target.closest("[data-close]")) close(); });
  window.addEventListener("keydown", onKey);
  document.body.style.overflow = "hidden";
  document.body.appendChild(o);
  o.querySelector("[data-close]").focus();
  cleanup.push(close);
}

function renderAbout() {
  document.title = "About — Quiet Operator";
  app.innerHTML = `
    <section class="about page">
      <h1 class="reveal" style="--i:0">About</h1>
      <div class="body reveal" style="--i:1">
        <p>I'm Bill Wagner. I build software in my free time, in Atlanta. I'm self-taught and not a professional developer, which means I've had to get good at the parts that aren't typing code: deciding what to build, specifying it precisely, and judging whether what came back is right.</p>
        <p>Everything on this site started as a small, specific annoyance: a grocery list that forgot what I always buy, a week that never got planned, a decision I kept making on a hunch instead of a number. Instead of hunting for an app, I write down what the tool has to do, decide where it should live, and build the smallest version worth using. Then I use it every day until it's obviously right or obviously wrong. Either way I learn something, and either way my week gets a little better.</p>
        <p>Self-taught, in the honest sense: no bootcamp, no degree in this, just years of reading, breaking things, and learning to ask better questions. The tools have changed what one person can build. They haven't changed what makes software good: a clear problem, a sound data model, and someone who checks the work.</p>
        <p>None of these are products. They're tools I rely on, which is the only test I care about. If one of them turns out to be useful to you, that's a bonus.</p>
        <div class="tools">
          <h3>How I work</h3>
          <p>Claude for planning, briefs, and judgment calls. Replit for full-stack web apps. Claude Code when I'm working directly in a repository. OpenClaw, an always-on assistant on a home server, for scheduled jobs that keep the other tools fed. GitHub, Cloudflare, Supabase, Vercel, and Resend for hosting, data, and email. Plain HTML for websites.</p>
          <p>AI writes most of the code. I own the decisions: what gets built, how the data is shaped, what stays private, and what gets cut.</p>
          <h3>Get in touch</h3>
          <p><span class="placeholder">Contact link goes here</span></p>
        </div>
      </div>
    </section>`;
  window.scrollTo(0, 0);
}

function renderNotFound() {
  document.title = "Not found — Quiet Operator";
  app.innerHTML = `<div class="page"><h1>Nothing here.</h1><p style="margin-top:1rem"><a href="#/">Back to the builds</a></p></div>`;
}

function route() {
  cleanup.forEach((fn) => fn()); cleanup = [];
  const hash = location.hash.replace(/^#/, "") || "/";
  if (hash === "builds") { const el = document.getElementById("builds"); if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); return; } }
  const parts = hash.split("/").filter(Boolean);
  let nav = "home";
  if (parts.length === 0) renderHome();
  else if (parts[0] === "builds" && parts[1]) renderBuild(parts[1]);
  else if (parts[0] === "about") { renderAbout(); nav = "about"; }
  else renderNotFound();
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === nav));
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
