<script>
/* Quiet Operator demo shim — core.
   Intercepts fetch() calls to /api/* and /auth/* and answers them from an in-memory
   sample dataset. Nothing leaves the browser; reloading resets everything. */
(function () {
  "use strict";
  const realFetch = window.fetch.bind(window);
  const routes = [];
  window.__DEMO__ = {
    on(method, pattern, handler) {
      routes.push({ method, re: new RegExp("^" + pattern.replace(/:(\w+)/g, "(?<$1>[^/]+)") + "$"), handler });
    },
    err(status, message) { return Object.assign(new Error(message), { status }); },
    json(data, status = 200, headers = {}) { return new Response(JSON.stringify(data), { status, headers: { "content-type": "application/json", ...headers } }); },
    text(body, type = "text/plain", headers = {}) { return new Response(body, { status: 200, headers: { "content-type": type, ...headers } }); },
    nowIso() { return new Date().toISOString(); },
  };
  const D = window.__DEMO__;

  async function handle(method, url, init) {
    let body = null;
    const raw = init && init.body;
    if (typeof raw === "string" && raw.trim()) { try { body = JSON.parse(raw); } catch { body = null; } }
    for (const r of routes) {
      if (r.method !== method) continue;
      const m = r.re.exec(url.pathname);
      if (!m) continue;
      const params = m.groups ? Object.fromEntries(Object.entries(m.groups).map(([k, v]) => [k, decodeURIComponent(v)])) : {};
      try {
        const out = r.handler(params, body, url.searchParams);
        if (out instanceof Response) return out;
        if (out === null || out === undefined) return new Response(null, { status: 204 });
        if (out && out.__status) return D.json(out.body, out.__status);
        return D.json(out);
      } catch (e) {
        return D.json({ error: e.message || "Request failed" }, e.status || 500);
      }
    }
    return D.json({ error: `Not available in the demo: ${method} ${url.pathname}` }, 404);
  }

  window.fetch = function (input, init) {
    let urlString;
    if (typeof input === "string") urlString = input;
    else if (input instanceof URL) urlString = input.href;
    else if (input && typeof input.url === "string") urlString = input.url;
    else return realFetch(input, init);
    let url;
    try { url = new URL(urlString, location.href); } catch { return realFetch(input, init); }
    if (url.origin !== location.origin || !/^\/(api|auth)(\/|$)/.test(url.pathname)) return realFetch(input, init);
    const method = ((init && init.method) || (input && input.method) || "GET").toUpperCase();
    return new Promise((resolve) => setTimeout(() => resolve(handle(method, url, init || {})), 30));
  };

  /* keep the demo stateless: no service worker, no leftover caches */
  if ("serviceWorker" in navigator) {
    try {
      navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
      Object.defineProperty(navigator.serviceWorker, "register", { value: () => Promise.reject(new Error("Service workers are disabled in the demo")), configurable: true });
    } catch { /* ignore */ }
  }
  try { if ("caches" in window) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {}); } catch { /* ignore */ }

  /* "Log in" buttons (shown only after a demo log-out) just reload the demo */
  document.addEventListener("click", (e) => { if (e.target && e.target.closest && e.target.closest('[data-testid="login-btn"],[data-testid="button-login"]')) { e.preventDefault(); e.stopPropagation(); location.reload(); } }, true);

  /* date helpers shared by the app shims */
  const pad = (n) => String(n).padStart(2, "0");
  D.key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  D.today = D.key(new Date());
  D.shift = (ymd, n) => { const [y, m, d] = ymd.split("-").map(Number); return D.key(new Date(y, m - 1, d + n)); };
  D.iso = (ymd, hour = 12) => { const [y, m, d] = ymd.split("-").map(Number); return new Date(y, m - 1, d, hour, 0, 0).toISOString(); };
  D.mondayOf = (ymd) => { const [y, m, d] = ymd.split("-").map(Number); const dt = new Date(y, m - 1, d); return D.key(new Date(y, m - 1, d - ((dt.getDay() + 6) % 7))); };
  D.dayNumber = (ymd) => Date.parse(ymd + "T00:00:00Z") / 86400000;
})();

<script>
/* Calibrate demo data and API. Requires core.js. All people, situations and results are invented. */
(function () {
  "use strict";
  const D = window.__DEMO__;
  const TODAY = D.today, ago = (n) => D.shift(TODAY, -n), ahead = (n) => D.shift(TODAY, n);
  try { localStorage.removeItem("calibrate-local-lock"); } catch { /* ignore */ }

  const domains = ["Client", "Partner", "Team", "Personal", "Side project"];
  const startingKit = ["Answer-first (Pyramid Principle)", "Steelman", "Cynefin", "Pre-mortem", "Outside view / base rates", "Decision vs. outcome quality"];
  const shelf = ["SCQA", "What / So what / Now what", "Ladder of inference", "Issue trees / MECE", "Hypothesis-first", "Inversion", "Second-order thinking", "One-way vs. two-way doors", "Bias checklist"];

  let nextId = 1;
  const entries = [];
  const P = (daysAgo, domain, situation, prediction, confidence, framework, resolveAfter, outcome, processQuality, note) => {
    const date = ago(daysAgo), resolveBy = D.shift(date, resolveAfter);
    const e = { id: nextId++, type: "prediction", date, domain, situation, prediction, confidence, framework, resolveBy, isSample: false };
    if (outcome) Object.assign(e, { status: "resolved", outcome, processQuality, resolutionNote: note || "", resolvedAt: D.iso(resolveBy, 18) });
    else e.status = "open";
    entries.push(e);
  };
  /* resolved predictions: mildly overconfident at the top end, well calibrated in the middle */
  P(78, "Client", "Proposal for a regional logistics firm", "We make the shortlist for the final round", 90, "Outside view / base rates", 14, "wrong", "sloppy", "Didn't check how many firms they usually shortlist. Base rate was three of eleven.");
  P(74, "Personal", "Moving the sofa up the stairs", "It fits without taking the door off", 60, "", 1, "wrong", "sloppy", "Measured the sofa, never the stairwell turn.");
  P(70, "Partner", "Dinner reservation for six", "Everyone confirms by Thursday", 70, "", 4, "right", "sound", "");
  P(66, "Team", "Sprint goal for the mobile release", "We ship the beta by the review date", 90, "Pre-mortem", 12, "right", "sound", "The pre-mortem surfaced the app-store review delay early.");
  P(63, "Side project", "Weekend build of a small booking tool", "I finish the first version in two weekends", 90, "", 14, "wrong", "sloppy", "It took five. Classic planning fallacy.");
  P(60, "Client", "Pricing review with a retail client", "They accept the second option without a counter", 80, "Steelman", 7, "right", "sound", "");
  P(57, "Personal", "Running a 10K", "I finish under 55 minutes", 70, "", 9, "right", "unsure", "");
  P(54, "Partner", "Holiday plans", "Her parents come to us this year", 50, "", 10, "wrong", "sound", "Genuine coin flip. Nothing to learn here.");
  P(52, "Team", "Hiring a contractor", "The first candidate accepts the offer", 80, "", 6, "right", "sloppy", "Lucky. I didn't have a plan B if they declined.");
  P(50, "Side project", "Launching a small landing page", "Fifty signups in the first week", 70, "Outside view / base rates", 7, "wrong", "sound", "Reasoned from comparable launches; this one just underperformed.");
  P(47, "Client", "Kickoff meeting", "The sponsor attends in person", 80, "", 3, "wrong", "sloppy", "Never confirmed the invite; it went to the wrong calendar.");
  P(44, "Personal", "Paying off a card", "I clear the balance by the end of the month", 60, "", 28, "right", "sound", "");
  P(41, "Team", "Vendor demo", "Security signs off after one round of questions", 70, "Pre-mortem", 10, "wrong", "sound", "Two rounds. Reasonable call, normal variance.");
  P(38, "Partner", "Surprise party", "Nobody lets it slip", 60, "", 5, "right", "unsure", "");
  P(35, "Side project", "Newsletter experiment", "Open rate stays above 40%", 80, "", 14, "right", "sound", "");
  P(32, "Client", "Quarterly review deck", "The sponsor asks for fewer than three revisions", 80, "Answer-first (Pyramid Principle)", 7, "wrong", "sound", "Answer-first helped, but they still wanted two extra scenarios.");
  P(30, "Team", "Release freeze", "No P1 incident in the first week after launch", 95, "Pre-mortem", 7, "right", "sound", "");
  P(27, "Personal", "Home repair", "The plumber arrives in the quoted window", 50, "", 3, "right", "unsure", "");
  P(24, "Partner", "Weekend trip", "It doesn't rain on Saturday", 60, "", 4, "wrong", "sound", "Forecast was 40%. Fair call.");
  P(21, "Client", "Renewal conversation", "They renew at the current scope", 90, "Steelman", 14, "right", "sound", "");
  P(18, "Personal", "Learning a new language", "I keep a 14-day streak", 80, "", 14, "right", "sound", "");
  P(15, "Team", "Planning poker", "My estimate lands within 20% of the final", 70, "Outside view / base rates", 10, "unclear", "unsure", "Scope changed halfway through; can't score it.");
  P(12, "Side project", "Writing the docs", "Docs are done before the beta goes out", 90, "", 8, "unclear", "unsure", "Beta slipped, so the question stopped meaning anything.");
  /* open predictions: one due today, one overdue, three still ahead */
  P(9, "Personal", "Contractor quote", "The revised quote arrives by end of day", 75, "", 9);
  P(7, "Team", "Beta readiness", "The team ships the beta before the review", 80, "Pre-mortem", 5);
  P(5, "Side project", "Launch week", "I land the first ten paying users by the 21st", 60, "Outside view / base rates", 12);
  P(3, "Client", "Scope conversation", "They approve the phased plan at the next meeting", 70, "Steelman", 11);
  P(1, "Partner", "Planning a move", "We both agree on a neighborhood by the end of the month", 70, "", 22);

  const C = (daysAgo, domain, asked, said, wishSaid, frameworkShouldHaveUsed) => entries.push({ id: nextId++, type: "conversation", date: ago(daysAgo), status: "resolved", isSample: false, domain, asked, said, wishSaid, frameworkShouldHaveUsed });
  C(0, "Team", "Do we have enough time to add the export feature?", "I think we can probably squeeze it in if nothing else slips.", "No for this release. Two reasons: the review slot is fixed and the export touches billing. We can have it next sprint.", "Answer-first (Pyramid Principle)");
  C(2, "Client", "Why did the numbers change between versions?", "There were a few updates to the data feed that came through late.", "The short answer is a late feed correction. Three rows moved, none of them change the recommendation.", "Answer-first (Pyramid Principle)");
  C(4, "Partner", "Are you sure we need a bigger place?", "I mean, it would be nice.", "Let me make sure I've got your concern right: you're worried about the cost, not the idea?", "Steelman");
  C(8, "Personal", "Can you cover the Saturday shift?", "Uh, I guess so.", "Not this Saturday. I can do the 14th.", "Decision vs. outcome quality");
  C(13, "Team", "What's the biggest risk to the timeline?", "Honestly, a lot of things could go wrong.", "Review turnaround. If it takes more than two days we miss the date.", "Pre-mortem");

  const R = (daysAgo, mode, framework, problem, notes, minutes) => entries.push({ id: nextId++, type: "drill", date: ago(daysAgo), status: "resolved", isSample: false, mode, framework, problem, notes, minutes });
  R(0, "work", "Answer-first (Pyramid Principle)", "Explain the delay in one sentence, then give three reasons.", "Took two tries. The first version buried the answer in the second sentence.", 6);
  R(1, "personal", "Pre-mortem", "We buy the standing desk. It's six months later and it's in a closet. Why?", "Likeliest: I never fix the chair height, and my back still hurts.", 8);
  R(3, "work", "Cynefin", "The vendor integration keeps failing in new ways. Clear, complicated, complex, or chaotic?", "Complex. Stop writing a plan; run two small experiments instead.", 7);
  R(5, "personal", "Outside view / base rates", "How long does a kitchen backsplash take for a first-timer?", "Looked up three comparable projects: a weekend is optimistic, plan on two.", 5);
  R(6, "work", "Steelman", "Argue for the option I rejected at Monday's meeting.", "Their best case is lower risk of a missed date. I'd weighted that too low.", 9);
  R(9, "personal", "Decision vs. outcome quality", "Was skipping the deposit a good decision? It worked out.", "Decision was weak (no fallback), outcome lucky. Counts as sloppy-right.", 6);

  let settings = {
    planStartDate: ago(42),
    liveDebriefs: { 7: false },
    taughtToolNote: "",
    samplesCleared: true,
    playbook: [
      { tool: "Answer-first", when: "Any question from a partner, client, or exec", phrase: "The short answer is X. Three reasons..." },
      { tool: "Steelman", when: "Before disagreeing or dismissing an option", phrase: "Let me make sure I've got your view right: you're saying..." },
      { tool: "Cynefin", when: "Start of any new problem", phrase: "Is this clear, complicated, complex, or chaotic?" },
      { tool: "Pre-mortem", when: "Before committing to a plan, hire, or purchase", phrase: "It's six months on and this failed. Why?" },
      { tool: "Outside view", when: "Before any estimate of time, cost, or odds", phrase: "What usually happens in situations like this one?" },
      { tool: "Decision vs. outcome", when: "Every review, especially after a good result", phrase: "Was the process sound, or did we get lucky?" },
    ],
  };
  const defaultSettings = () => ({ ...settings, planStartDate: TODAY, liveDebriefs: {}, taughtToolNote: "" });
  const reviews = [];
  let reviewId = 1;
  const monday = D.mondayOf(TODAY);
  reviews.push({ id: reviewId++, kind: "weekly", periodStart: D.shift(monday, -7), notes: "Four predictions resolved. Two were sloppy-right: I got the outcome but couldn't have defended the process. The vendor call went well because I led with the answer.", oneThingToChange: "Write the base rate down before I give any estimate.", completedChecklist: [0, 1, 2, 3], createdAt: D.iso(D.shift(monday, -2), 20) });
  reviews.push({ id: reviewId++, kind: "weekly", periodStart: D.shift(monday, -14), notes: "Overconfident on anything involving other people's calendars. Reminder to confirm before predicting.", oneThingToChange: "Cap confidence at 80% for anything that depends on someone else's schedule.", completedChecklist: [0, 1, 2], createdAt: D.iso(D.shift(monday, -9), 20) });
  reviews.push({ id: reviewId++, kind: "monthly", periodStart: D.shift(D.today.slice(0, 8) + "01", -31).slice(0, 8) + "01", notes: "Brier score improved over the month. The 90% bucket is still the problem: it hits about 60%.", oneThingToChange: "Use 80% as my ceiling until the 90% bucket recovers.", completedChecklist: [0, 1, 2, 3, 4], createdAt: D.iso(D.shift(monday, -20), 20) });

  /* ---------- server logic, mirrored from the real app ---------- */
  const validDate = (d) => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d) && new Date(d + "T00:00:00Z").toISOString().slice(0, 10) === d;
  const flat = (e) => ({ ...e });
  function checkEntry(data) {
    if (!validDate(data.date)) throw D.err(400, "Choose a valid entry date.");
    const fields = data.type === "prediction" ? ["domain", "situation", "prediction", "confidence", "resolveBy"] : data.type === "conversation" ? ["domain", "asked", "said", "wishSaid"] : ["mode", "framework", "problem", "notes", "minutes"];
    for (const f of fields) if (data[f] === undefined || (typeof data[f] === "string" && !data[f].trim() && f !== "wishSaid")) throw D.err(400, `Please fill in ${f}.`);
    if (data.type === "prediction" && !validDate(data.resolveBy)) throw D.err(400, "Choose a valid resolution date.");
    for (const f of ["framework", "frameworkShouldHaveUsed"]) if (data[f] && ![...startingKit, ...shelf].includes(String(data[f]))) throw D.err(400, "Choose a framework from the list.");
  }
  function todaySummary(date) {
    const rawWeek = Math.floor((D.dayNumber(date) - D.dayNumber(settings.planStartDate)) / 7) + 1;
    const currentWeek = Math.max(1, Math.min(12, rawWeek)), maintenance = rawWeek > 12;
    const phase = maintenance ? "Maintenance" : currentWeek <= 2 ? "Calibration baseline" : currentWeek <= 6 ? "Written reps" : currentWeek <= 10 ? "Live reps" : "Consolidate";
    const due = entries.filter((e) => e.type === "prediction" && e.status === "open" && e.resolveBy && e.resolveBy <= date);
    const daily = entries.filter((e) => e.date === date);
    const reps = { 7: "Answer first, before you feel ready.", 8: "Name the question behind the question.", 9: "Argue the other side out loud when you hold a strong view.", 10: "Steelman a position you disagree with before responding." };
    return {
      date, currentWeek, maintenance, phase, drillMode: Number(date.slice(8)) % 2 ? "work" : "personal",
      dueCount: due.filter((e) => e.resolveBy === date).length, overdueCount: due.filter((e) => e.resolveBy < date).length,
      predictionDone: daily.some((e) => e.type === "prediction"), conversationDone: daily.some((e) => e.type === "conversation"), drillDone: daily.some((e) => e.type === "drill"),
      liveRep: maintenance ? "" : reps[currentWeek] ?? "", liveDebriefDone: !!settings.liveDebriefs[String(currentWeek)], taughtToolNote: settings.taughtToolNote,
      activity: Array.from({ length: 7 }, (_, i) => { const d = D.shift(date, i - 6); return { date: d, count: entries.filter((e) => e.date === d).length }; }),
    };
  }
  function calibrationStats() {
    const preds = entries.filter((e) => e.type === "prediction" && e.status === "resolved" && (e.outcome === "right" || e.outcome === "wrong"));
    const score = (es) => (es.length ? es.reduce((s, e) => s + (e.confidence / 100 - (e.outcome === "right" ? 1 : 0)) ** 2, 0) / es.length : null);
    const buckets = [50, 60, 70, 80, 90, 95, 99];
    const bucketFor = (c) => buckets.reduce((best, b) => (Math.abs(b - c) < Math.abs(best - c) ? b : best), 50);
    const domainStats = domains.map((domain) => {
      const es = preds.filter((e) => e.domain === domain), n = es.length;
      const averageConfidence = n ? es.reduce((s, e) => s + e.confidence, 0) / n : 0;
      const hitRate = n ? (es.filter((e) => e.outcome === "right").length / n) * 100 : 0;
      return { domain, n, averageConfidence, hitRate, gap: averageConfidence - hitRate };
    });
    const over = domainStats.filter((d) => d.n > 0 && d.gap > 0).sort((a, b) => b.gap - a.gap)[0];
    const cnt = (q, o) => preds.filter((e) => e.processQuality === q && e.outcome === o).length;
    return {
      n: preds.length, brierAllTime: score(preds), brier90Days: score(preds.filter((e) => e.resolvedAt && Date.parse(e.resolvedAt) >= Date.now() - 90 * 86400000)),
      buckets: buckets.flatMap((b) => { const es = preds.filter((e) => bucketFor(e.confidence) === b); return es.length ? [{ confidence: b, n: es.length, hitRate: (es.filter((e) => e.outcome === "right").length / es.length) * 100 }] : []; }),
      domains: domainStats, mostOverconfident: over ? over.domain : null,
      matrix: { soundRight: cnt("sound", "right"), soundWrong: cnt("sound", "wrong"), sloppyRight: cnt("sloppy", "right"), sloppyWrong: cnt("sloppy", "wrong") },
    };
  }

  /* ---------- routes ---------- */
  const session = () => ({ configured: true, authenticated: true, sessionExpiresAt: new Date(Date.now() + 30 * 86400000).toISOString() });
  D.on("GET", "/api/healthz", () => ({ status: "ok" }));
  D.on("GET", "/api/auth/status", () => session());
  D.on("POST", "/api/auth/login", () => session()); // the demo accepts any PIN
  D.on("POST", "/api/auth/logout", () => ({ success: true }));
  D.on("PUT", "/api/auth/pin", () => ({ success: true }));

  D.on("GET", "/api/entries", (_, __, q) => {
    const type = q.get("type"), status = q.get("status"), start = q.get("start"), end = q.get("end");
    const out = entries.filter((e) => (!type || e.type === type) && (!status || e.status === status) && (!start || e.date >= start) && (!end || e.date <= end)).map(flat);
    out.sort((a, b) => (status === "open" ? (a.resolveBy ?? a.date).localeCompare(b.resolveBy ?? b.date) : b.date.localeCompare(a.date) || b.id - a.id));
    return out;
  });
  D.on("POST", "/api/entries", (_, body) => {
    checkEntry(body);
    const e = { ...body, id: nextId++, status: body.type === "prediction" ? "open" : "resolved", isSample: false };
    entries.push(e); return flat(e);
  });
  D.on("PATCH", "/api/entries/:id", (p, body) => {
    const i = entries.findIndex((e) => e.id === Number(p.id)); if (i < 0) throw D.err(404, "Entry not found.");
    if (body.type && body.type !== entries[i].type) throw D.err(400, "An entry's type cannot be changed.");
    const next = { ...entries[i], ...body, type: entries[i].type }; checkEntry(next); entries[i] = next; return flat(next);
  });
  D.on("DELETE", "/api/entries/:id", (p) => { const i = entries.findIndex((e) => e.id === Number(p.id)); if (i < 0) throw D.err(404, "Entry not found."); entries.splice(i, 1); return { success: true }; });
  D.on("POST", "/api/entries/:id/resolve", (p, body) => {
    const i = entries.findIndex((e) => e.id === Number(p.id) && e.type === "prediction"); if (i < 0) throw D.err(404, "Prediction not found.");
    entries[i] = { ...entries[i], status: "resolved", outcome: body.outcome, processQuality: body.processQuality, resolutionNote: body.resolutionNote ?? "", resolvedAt: D.nowIso() };
    return flat(entries[i]);
  });
  D.on("GET", "/api/today", (_, __, q) => { const date = q.get("date") || TODAY; if (!validDate(date)) throw D.err(400, "Invalid calendar date."); return todaySummary(date); });
  D.on("GET", "/api/stats", () => calibrationStats());
  D.on("GET", "/api/settings", () => settings);
  D.on("PATCH", "/api/settings", (_, input) => {
    if (input.planStartDate && !validDate(input.planStartDate)) throw D.err(400, "Invalid plan start date.");
    if (input.playbook && (input.playbook.length !== 6 || input.playbook.some((t) => !String(t.tool).trim()))) throw D.err(400, "The Playbook needs six named tools.");
    settings = { ...settings, ...input, liveDebriefs: { ...settings.liveDebriefs, ...(input.liveDebriefs || {}) } }; return settings;
  });
  D.on("GET", "/api/reviews", () => [...reviews].sort((a, b) => b.periodStart.localeCompare(a.periodStart)));
  D.on("POST", "/api/reviews", (_, input) => {
    if (!validDate(input.periodStart)) throw D.err(400, "Invalid review period.");
    const data = { ...input, oneThingToChange: input.oneThingToChange ?? "", completedChecklist: input.completedChecklist ?? [] };
    const i = reviews.findIndex((r) => r.kind === input.kind && r.periodStart === input.periodStart);
    const row = { ...data, id: i >= 0 ? reviews[i].id : reviewId++, createdAt: i >= 0 ? reviews[i].createdAt : D.nowIso() };
    if (i >= 0) reviews[i] = row; else reviews.push(row); return row;
  });
  D.on("DELETE", "/api/samples", () => ({ success: true }));
  D.on("DELETE", "/api/data", (_, __, q) => {
    if (q.get("confirmation") !== "DELETE") throw D.err(400, "Type DELETE to confirm permanent deletion of all journal data.");
    entries.length = 0; reviews.length = 0; settings = { ...defaultSettings(), samplesCleared: true }; return { success: true };
  });
  D.on("GET", "/api/export", (_, __, q) => {
    const format = q.get("format"), name = `calibrate-demo.${format === "markdown" ? "md" : format}`;
    const head = { "content-disposition": `attachment; filename="${name}"` };
